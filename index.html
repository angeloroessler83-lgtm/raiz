<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raiz — diagnóstico de Matemática</title>
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raiz">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-512.png">
<link rel="icon" href="icone-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1ea;--card:#fffdf8;--ink:#141414;--mute:#6b665d;--line:#ddd6c8;--acc:#ff5a1f;--ok:#1f8a4c;--bad:#d23b2a;--warn:#c98a00;--soft:#ebe5d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px;min-height:100vh}
h1,h2,.big{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:1}
h1{font-size:52px;margin:8px 0 6px}
h2{font-size:30px;margin:28px 0 10px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.mute{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.btn{display:block;width:100%;padding:15px 18px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;margin-top:10px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.acc{background:var(--acc)}
.btn:disabled{opacity:.35;cursor:default}
.link{background:none;color:var(--mute);text-decoration:underline;padding:8px 0;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.prof{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);padding:14px 16px;margin:8px 0}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Anton,sans-serif;font-size:22px}
input,select{font:inherit;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-top:6px}
label{display:block;margin-top:14px;font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:10px 14px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .4s}
.qtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);padding:5px 9px;border-radius:6px}
.stem{font-size:20px;line-height:1.4;margin:16px 0 18px;font-weight:500}
.stem table{border-collapse:collapse;margin:10px 0;font-size:16px}
.stem td,.stem th{border:1px solid var(--line);padding:6px 10px;text-align:center;background:#fff}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin:8px 0;background:var(--card);border:1.5px solid var(--line);font-size:17px;border-radius:12px}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.opt.ns{border-style:dashed;color:var(--mute);font-size:15px}
.opt.ns.on{color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;transition:.3s;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:30px;line-height:1}
.stat span{font-size:12px;color:var(--mute)}
.lvl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border:0}
.lvl .nm{flex:1;font-weight:600;font-size:15px}
.steps{display:flex;gap:3px}
.steps i{width:22px;height:22px;border-radius:5px;background:var(--soft);font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;color:var(--mute)}
.steps i.ok{background:var(--ok);color:#fff}
.steps i.bad{background:var(--bad);color:#fff}
.steps i.na{background:transparent;border:1px dashed var(--line)}
.root{border-left:4px solid var(--acc)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;background:var(--soft);margin-right:4px}
.pill.ok{background:#dcefe3;color:var(--ok)}.pill.bad{background:#f6dcd8;color:var(--bad)}.pill.warn{background:#f6ebcc;color:#8a6000}
.ans{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.ans:last-child{border:0}
.tabs{display:flex;gap:6px;margin:14px 0 4px}
.tabs button{flex:1;padding:10px;background:var(--soft);font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff}
.note{font-size:13px;background:#fff6d6;border:1px solid #efdc9b;border-radius:10px;padding:10px 12px;margin:10px 0}
.pin{font-family:Anton,sans-serif;font-size:34px;letter-spacing:.4em;text-align:center}
.hero{font-family:Anton,sans-serif;font-size:88px;line-height:.9;color:var(--acc)}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">Carregando…</p></div>
<div class="toast" id="toast"></div>
<script>
const SK = [{"c":"EF05MA01","g":5,"a":"Números","n":"Números naturais até centenas de milhar","p":[],"l":100,"d":"S","q":"Qual é o número <b>trezentos e quatro mil e sessenta</b>?","o":["304.060","304.600","300.460","34.060"],"e":["trocou a ordem das casas","posicionou o 4 e o 60 nas casas erradas","esqueceu o zero que segura uma casa"]},{"c":"EF05MA02","g":5,"a":"Números","n":"Ler, escrever e ordenar decimais","p":["EF05MA01"],"l":98,"d":"S","q":"Qual destes números é o <b>maior</b>?","o":["0,8","0,75","0,125","0,09"],"e":["achou que mais algarismos = maior","achou que mais algarismos = maior","ignorou o valor da posição"]},{"c":"EF05MA03","g":5,"a":"Números","n":"Representar frações (parte do todo e divisão)","p":[],"l":66,"d":"S","q":"Uma pizza foi cortada em 8 pedaços iguais e João comeu 3. Que fração da pizza ele comeu?","o":["3/8","3/5","8/3","5/8"],"e":["comparou comido com o que sobrou","inverteu numerador e denominador","contou o que sobrou"]},{"c":"EF05MA04","g":5,"a":"Números","n":"Frações equivalentes","p":["EF05MA03"],"l":63,"d":"S","q":"Qual fração é <b>equivalente</b> a 2/3?","o":["8/12","4/5","2/6","3/4"],"e":["somou o mesmo número em cima e embaixo","mudou só o denominador","somou 1 em cima e embaixo"]},{"c":"EF05MA05","g":5,"a":"Números","n":"Comparar frações e decimais na reta","p":["EF05MA02","EF05MA04"],"l":61,"d":"S","q":"Qual destes números é o <b>maior</b>: 1/2, 0,4, 3/5 ou 0,55?","o":["3/5","0,55","1/2","0,4"],"e":["achou que mais algarismos = maior","não converteu fração em decimal","não comparou os valores"]},{"c":"EF05MA06","g":5,"a":"Números","n":"Porcentagens básicas (10%, 25%, 50%, 75%)","p":["EF05MA04"],"l":8,"d":"S","q":"Quanto é <b>25% de 80</b>?","o":["20","25","40","8"],"e":["copiou o número da porcentagem","calculou 50%","calculou 10%"]},{"c":"EF05MA07","g":5,"a":"Números","n":"Adição e subtração com naturais e decimais","p":["EF05MA02"],"l":85,"d":"S","q":"Quanto é <b>8,4 − 2,75</b>?","o":["5,65","6,35","5,75","6,65"],"e":["subtraiu o menor do maior em cada casa","errou o empréstimo","errou o empréstimo"]},{"c":"EF05MA08","g":5,"a":"Números","n":"Multiplicação e divisão com naturais e decimais","p":["EF05MA07"],"l":84,"d":"S","q":"Um caderno custa R$ 4,50. Quanto custam <b>6 cadernos</b>?","o":["R$ 27,00","R$ 24,30","R$ 2,70","R$ 270,00"],"e":["multiplicou inteiros e centavos separados","colocou a vírgula no lugar errado","colocou a vírgula no lugar errado"]},{"c":"EF05MA09","g":5,"a":"Números","n":"Contagem pelo princípio multiplicativo (inicial)","p":["EF05MA08"],"l":3,"d":"S","q":"Uma lanchonete tem 3 tipos de pão e 4 tipos de recheio. Quantos sanduíches diferentes dá para montar com 1 pão e 1 recheio?","o":["12","7","4","24"],"e":["somou em vez de multiplicar","contou só os recheios","dobrou sem motivo"]},{"c":"EF05MA10","g":5,"a":"Álgebra","n":"Igualdade se mantém ao operar os dois lados","p":["EF05MA08"],"l":32,"d":"S","q":"Uma balança está equilibrada: num prato há 2 caixas iguais e no outro um peso de 10 kg. Se tiramos 1 caixa, o que fazer para continuar equilibrada?","o":["Tirar 5 kg do outro prato","Tirar 1 kg do outro prato","Não mexer no outro prato","Tirar 10 kg do outro prato"],"e":["tirou a quantidade de caixas, não o peso","não manteve a igualdade","não percebeu que cada caixa pesa 5 kg"]},{"c":"EF05MA11","g":5,"a":"Álgebra","n":"Igualdade com um termo desconhecido","p":["EF05MA10"],"l":31,"d":"S","q":"Que número completa: <b>□ + 15 = 42</b>?","o":["27","57","37","42"],"e":["somou em vez de subtrair","errou a subtração","repetiu o resultado"]},{"c":"EF05MA12","g":5,"a":"Álgebra","n":"Proporcionalidade direta (receitas, escalas)","p":["EF05MA08"],"l":23,"d":"S","q":"Uma receita usa 3 ovos para 2 xícaras de farinha. Para <b>6 xícaras</b> de farinha, quantos ovos?","o":["9","7","6","12"],"e":["somou a diferença em vez de multiplicar","copiou o número de xícaras","multiplicou pelo fator errado"]},{"c":"EF05MA13","g":5,"a":"Álgebra","n":"Dividir em partes desiguais (dobro, triplo)","p":["EF05MA03","EF05MA08"],"l":15,"d":"S","q":"Ana e Bia vão dividir 30 figurinhas, e Ana deve ficar com o <b>dobro</b> de Bia. Com quantas Bia fica?","o":["10","15","20","5"],"e":["dividiu em partes iguais","deu a parte de Ana","dividiu por 6"]},{"c":"EF05MA14","g":5,"a":"Geometria","n":"Localização no plano (mapas, coordenadas)","p":[],"l":9,"d":"S","q":"Num mapa com colunas A, B, C, D e linhas 1 a 4, a escola está em <b>B2</b>. A praça fica 2 colunas à direita e 1 linha acima (linha de número maior). Onde fica a praça?","o":["D3","C3","D1","B4"],"e":["andou só 1 coluna","andou para o lado errado na linha","trocou colunas por linhas"]},{"c":"EF05MA15","g":5,"a":"Geometria","n":"Plano cartesiano, 1º quadrante","p":["EF05MA14"],"l":8,"d":"S","q":"No plano cartesiano, o ponto <b>(4, 2)</b> fica:","o":["4 para a direita e 2 para cima","2 para a direita e 4 para cima","4 para a esquerda e 2 para baixo","na posição 6 do eixo"],"e":["trocou x e y","errou o sentido dos eixos","somou as coordenadas"]},{"c":"EF05MA16","g":5,"a":"Geometria","n":"Planificações de sólidos","p":[],"l":2,"d":"S","q":"Uma planificação tem <b>2 triângulos e 3 retângulos</b>. Que sólido ela forma?","o":["Prisma de base triangular","Pirâmide de base triangular","Cubo","Pirâmide de base quadrada"],"e":["confundiu prisma com pirâmide","não contou as faces","confundiu as faces"]},{"c":"EF05MA17","g":5,"a":"Geometria","n":"Polígonos: lados, vértices e ângulos","p":[],"l":32,"d":"S","q":"Um polígono tem 6 lados. Quantos vértices e quantos ângulos internos ele tem?","o":["6 vértices e 6 ângulos","6 vértices e 12 ângulos","12 vértices e 6 ângulos","5 vértices e 6 ângulos"],"e":["dobrou os ângulos","dobrou os vértices","errou a contagem de vértices"]},{"c":"EF05MA18","g":5,"a":"Geometria","n":"Ampliação e redução de figuras","p":["EF05MA17","EF05MA12"],"l":7,"d":"S","q":"Um retângulo de 3 cm por 5 cm foi ampliado e o lado de 3 cm virou 6 cm. Para não deformar, o lado de 5 cm vira:","o":["10 cm","8 cm","5 cm","15 cm"],"e":["somou em vez de multiplicar","não ampliou o outro lado","multiplicou pelo fator errado"]},{"c":"EF05MA19","g":5,"a":"Grandezas e medidas","n":"Medidas e conversão de unidades","p":["EF05MA02","EF05MA08"],"l":12,"d":"S","q":"Quantos centímetros há em <b>2,5 metros</b>?","o":["250","25","2.500","205"],"e":["multiplicou por 10","multiplicou por 1000","escreveu a vírgula como zero"]},{"c":"EF05MA20","g":5,"a":"Grandezas e medidas","n":"Perímetro e área não andam juntos","p":["EF05MA19"],"l":11,"d":"S","q":"Dois terrenos têm o mesmo perímetro, 16 m: um mede 4 m × 4 m e o outro 2 m × 6 m. O que é verdade?","o":["O de 4 × 4 tem área maior","Os dois têm a mesma área","O de 2 × 6 tem área maior","Área e perímetro são sempre o mesmo número"],"e":["achou que mesmo perímetro = mesma área","não calculou as áreas","confundiu área com perímetro"]},{"c":"EF05MA21","g":5,"a":"Grandezas e medidas","n":"Volume por empilhamento de cubos","p":["EF05MA08"],"l":10,"d":"S","q":"Uma caixa está cheia de cubinhos: 4 de comprimento, 3 de largura e 2 de altura. Quantos cubinhos há?","o":["24","9","12","18"],"e":["somou as medidas","contou só uma camada","errou a multiplicação"]},{"c":"EF05MA22","g":5,"a":"Probabilidade e estatística","n":"Resultados possíveis de um experimento","p":[],"l":5,"d":"S","q":"Lançando um dado comum, quais resultados são <b>números pares</b>?","o":["2, 4 e 6","1, 3 e 5","2 e 4","Só o 6"],"e":["confundiu par com ímpar","esqueceu um resultado","esqueceu resultados"]},{"c":"EF05MA23","g":5,"a":"Probabilidade e estatística","n":"Probabilidade em resultados igualmente prováveis","p":["EF05MA22","EF05MA03"],"l":4,"d":"S","q":"Numa caixa há 3 bolas vermelhas e 5 azuis. Tirando uma sem olhar, qual a chance de sair <b>vermelha</b>?","o":["3/8","3/5","1/2","5/8"],"e":["comparou vermelhas com azuis, não com o total","achou que são só duas opções iguais","calculou a das azuis"]},{"c":"EF05MA24","g":5,"a":"Probabilidade e estatística","n":"Ler tabelas e gráfi const QP = {};
function qp(c){
  if (QP[c]) return QP[c];
  const out = new Set();
  for (const p of BY[c].p){ if (BY[p].q) out.add(p); else qp(p).forEach(x => out.add(x)); }
  return QP[c] = [...out];
}
const ANC = {};
function anc(c){
  if (ANC[c]) return ANC[c];
  const out = new Set();
  for (const p of qp(c)){ out.add(p); anc(p).forEach(x => out.add(x)); }
  return ANC[c] = out;
}

function palavras(s){ return s.q.replace(/<[^>]+>/g," ").split(/\s+/).filter(Boolean).length + s.o.join(" ").split(/\s+/).length; }
function limiteChute(s){ return Math.max(4, palavras(s) * 0.15) * 1000; } // abaixo disso não deu tempo nem de ler
function alvo(p){ return DIAG.filter(s => s.g <= p.ano); }
function estado(p){
  const st = {};
  for (const r of p.respostas){ st[r.c] = r.ok ? (r.rap ? "chute" : "ok") : "falha"; }
  const pres = new Set();
  for (const c in st) if (st[c] === "ok") anc(c).forEach(a => { if (!st[a]) pres.add(a); });
  pres.forEach(a => st[a] = "presumido");
  return st;
}
function proxima(p){
  const st = estado(p);
  // 1) cava a raiz: pré-requisitos da falha (ou chute) mais recente primeiro
  for (let i = p.respostas.length - 1; i >= 0; i--){
    const r = p.respostas[i];
    if (st[r.c] === "falha" || st[r.c] === "chute"){
      const cand = qp(r.c).filter(x => !st[x]).sort((a,b) => BY[b].g - BY[a].g || BY[b].l - BY[a].l);
      if (cand.length) return cand[0];
    }
  }
  // 2) sobe pelo topo: habilidade sem resposta, do ano mais alto, alternando a área
  const ult = p.respostas.length ? BY[p.respostas[p.respostas.length-1].c].a : null;
  const pend = alvo(p).filter(s => !st[s.c]).sort((a,b) => b.g - a.g || (a.a === ult) - (b.a === ult) || b.l - a.l);
  return pend.length ? pend[0].c : null;
}
function resumo(p){
  const st = estado(p), T = alvo(p);
  const cont = {ok:0, presumido:0, falha:0, chute:0, pend:0};
  T.forEach(s => cont[st[s.c] || "pend"]++);
  const bom = x => x === "ok" || x === "presumido";
  const raizes = T.filter(s => (st[s.c] === "falha" || st[s.c] === "chute") && qp(s.c).every(x => bom(st[x]))).sort((a,b) => b.l - a.l);
  const travadas = T.filter(s => (st[s.c] === "falha" || st[s.c] === "chute") && !raizes.includes(s));
  const niveis = AREAS.map(a => {
    const anos = [];
    for (let g = 5; g <= p.ano; g++){
      const ss = T.filter(s => s.a === a && s.g === g);
      if (!ss.length){ anos.push({g, k:"na"}); continue; }
      const ruins = ss.filter(s => st[s.c] === "falha" || st[s.c] === "chute").length;
      const pend = ss.filter(s => !st[s.c]).length;
      anos.push({g, k: ruins ? "bad" : pend ? "pend" : "ok"});
    }
    let nivel = 4;
    for (const x of anos){ if (x.k === "ok" || x.k === "na") nivel = x.g; else break; }
    return {a, anos, nivel};
  });
  const total = T.length, feito = total - cont.pend;
  const rap = p.respostas.filter(r => r.rap).length;
  return {st, cont, raizes, travadas, niveis, total, feito, rap, fim: !proxima(p)};
}

  <h2>Quem vai estudar?</h2>
  ${lista.map(([id,p]) => { const r = resumo(p); return `
    <button class="prof" onclick="ir('pronto',{id:'${id}'})">
      <span class="av">${esc(p.nome[0] || "?").toUpperCase()}</span>
      <span class="sp"><b>${esc(p.nome)}</b><br><span class="small mute">Até o ${p.ano}º ano · ${r.fim ? "diagnóstico completo" : Math.round(100*r.feito/r.total) + "% do diagnóstico"}</span></span>
      <span>→</span>
    </button>`; }).join("")}
  <button class="btn alt" onclick="ir('novo')">+ Novo perfil</button>
  <button class="btn" style="margin-top:28px" onclick="ir('pais')">Área dos pais</button>
  ${online ? "" : '<p class="note">Sem internet: as respostas ficam guardadas neste aparelho e são enviadas quando a conexão voltar.</p>'}`;
};
VIEWS.novo = () => `
  <button class="link" onclick="ir('inicio')">← Voltar</button>
  <div class="kicker">Novo perfil</div>
  <h1>Quem é você?</h1>
  <label>Seu nome<input id="nm" maxlength="24" autocomplete="off" placeholder="Ex.: Bernardo"></label>
  <label>Qual o último ano que você terminou ou está terminando agora?</label>
  <div class="chips" id="anos">${[5,6,7,8,9].map(g => `<button class="chip" data-g="${g}">${g}º ano</button>`).join("")}</div>
  <p class="small mute">O diagnóstico vai até esse ano. Ex.: terminando o 8º, escolha 8º.</p>
  <button class="btn acc" id="criar" disabled>Criar perfil</button>`;
VIEWS.novo_depois = () => {
  let g = null; const ok = () => $("criar").disabled = !(g && $("nm").value.trim());
  document.querySelectorAll("#anos .chip").forEach(b => b.onclick = () => { g = +b.dataset.g; document.querySelectorAll("#anos .chip").forEach(x => x.classList.toggle("on", x === b)); ok(); });
  $("nm").oninput = ok;
  $("criar").onclick = async () => {
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    perfis[id] = {nome: $("nm").value.trim(), ano: g, criado: Date.now(), respostas: []};
    await salvarPerfil(id); ir("pronto", {id});
  };
};
VIEWS.pronto = () => {
  const p = perfis[TELA.id]; if (!p) return VIEWS.inicio();
  const r = resumo(p);
  if (r.fim) return `
    <button class="link" onclick="ir('inicio')">← Início</button>
    <div class="kicker">${esc(p.nome)}</div><h1>Diagnóstico completo</h1>
    <button class="btn acc" onclick="ir('resultado',{id:'${TELA.id}',volta:'pronto'})">Ver meu resultado</button>`;
  return `
  <button class="link" onclick="ir('inicio')">← Início</button>
  <div class="kicker">Olá, ${esc(p.nome)}</div>
  <h1>${p.respostas.length ? "Vamos continuar" : "Antes de começar"}</h1>
  <div class="card">
    <p style="margin-top:0">São rodadas de até <b>${RODADA} questões</b>. Não vale nota: o objetivo é achar o que falta na sua base.</p>
    <p>Quando você erra, o app volta um passo e pergunta o que vem antes, até achar a raiz.</p>
    <p style="margin-bottom:0"><b>Não sabe? Toque em “Não sei”.</b> É melhor que chutar: o chute esconde o que precisa ser treinado.</p>
  </div>
  <div class="bar"><i style="width:${Math.round(100*r.feito/r.total)}%"></i></div>
  <p class="small mute">${r.feito} de ${r.total} habilidades já avaliadas (direto ou pela lógica dos pré-requisitos)</p>
  <button class="btn acc" onclick="comecarRodada('${TELA.id}')">${p.respostas.length ? "Começar a próxima rodada" : "Começar"}</button>
  ${p.respostas.length ? `<button class="btn alt" onclick="ir('resultado',{id:'${TELA.id}',volta:'pronto'})">Ver resultado parcial</button>` : ""}`;
};
let RUN = null;
function comecarRodada(id){ RUN = {id, n:0, rapSeg:0}; proximaQuestao(); }
function proximaQuestao(){
  const p = perfis[RUN.id]; const c = proxima(p);
  if (!c || RUN.n >= RODADA){ ir("fimrodada", {id: RUN.id}); return; }
  const s = BY[c];
  const ordem = [0,1,2,3].sort(() => Math.random() - .5);
  RUN.q = {c, ordem, t0: 0, esc: null};
  ir("questao");
}
VIEWS.questao = () => {
  const s = BY[RUN.q.c];
  return `
  <div class="row"><button class="link" onclick="ir('fimrodada',{id:RUN.id,parou:true})">Pausar</button><span class="sp"></span><span class="small mute">${RUN.n + 1} de ${RODADA}</span></div>
  <div class="bar"><i style="width:${100*RUN.n/RODADA}%"></i></div>
  <div style="margin-top:18px"><span class="qtag">${esc(AREA_CURTA[s.a])}</span></div>
  <div class="stem">${s.q}</div>
  ${RUN.q.ordem.map(i => `<button class="opt" data-i="${i}">${esc(s.o[i])}</button>`).join("")}
  <button class="opt ns" data-i="-1">Não sei</button>
  <button class="btn" id="conf" disabled>Confirmar</button>`;
};
VIEWS.questao_depois = () => {
  RUN.q.t0 = performance.now(); RUN.q.esc = null;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    RUN.q.esc = +b.dataset.i;
    document.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b));
    $("conf").disabled = false;
  });
  $("conf").onclick = responder;
};
function responder(){
  const s = BY[RUN.q.c], p = perfis[RUN.id];
  const t = Math.round(performance.now() - RUN.q.t0);
  const i = RUN.q.esc, ok = i === 0, rap = i !== -1 && t < limiteChute(s);
  p.respostas.push({c: s.c, i, ok, t, rap, ts: Date.now()});
  salvarPerfil(RUN.id);
  RUN.n++;
  if (rap){ RUN.rapSeg++; aviso(RUN.rapSeg >= 2 ? "Foi bem rápido de novo. Leia a questão inteira antes de escolher." : "Essa foi rápida! Lembre de ler com calma."); }
  else RUN.rapSeg = 0;
  proximaQuestao();
}
VIEWS.fimrodada = () => {
  const p = perfis[TELA.id], r = resumo(p);
  return `
  <div class="kicker">${esc(p.nome)}</div>
  <h1>${r.fim ? "Diagnóstico completo!" : TELA.parou ? "Pausado" : "Rodada concluída"}</h1>
  <div class="hero">${Math.round(100*r.feito/r.total)}%</div>
  <p class="mute">do diagnóstico feito. Tudo fica salvo.</p>
  ${r.fim ? `<button class="btn acc" onclick="ir('resultado',{id:'${TELA.id}',volta:'inicio'})">Ver meu resultado</button>` :
  `<button class="btn acc" onclick="comecarRodada('${TELA.id}')">Mais uma rodada</button>
   <button class="btn alt" onclick="ir('resultado',{id:'${TELA.id}',volta:'inicio'})">Ver resultado parcial</button>`}
  <button class="btn alt" onclick="ir('inicio')">Sair</button>`;
};
function blocoResultado(p, r){
  return `
  <div class="stat">
    <div><b>${r.cont.ok + r.cont.presumido}</b><span>habilidade${r.cont.ok + r.cont.presumido===1?"":"s"} dominada${r.cont.ok + r.cont.presumido===1?"":"s"}</span></div>
    <div><b style="color:var(--bad)">${r.cont.falha + r.cont.chute}</b><span>com lacuna</span></div>
    <div><b class="mute">${r.cont.pend}</b><span>ainda sem avaliar</span></div>
  </div>
  ${r.fim ? "" : '<p class="note">Resultado parcial: ainda faltam rodadas. Os níveis podem mudar.</p>'}
  <h2>Nível real por área</h2>
  <div class="card">
    ${r.niveis.map(n => `<div class="lvl"><span class="nm">${esc(AREA_CURTA[n.a])}<br><span class="small mute">${nomeNivel(n.nivel)}</span></span>
      <span class="steps">${n.anos.map(x => `<i class="${x.k}" title="${x.g}º">${x.g}º</i>`).join("")}</span></div>`).join("")}
    <p class="small mute" style="margin-bottom:0">Verde: ano dominado · Vermelho: tem lacuna · Cinza: falta avaliar</p>
  </div>
  <h2>Comece por aqui</h2>
  ${r.raizes.length ? `<p class="small mute">Estas são as raízes: lacunas cuja base já está firme. Consertando cada uma, destrava o que vem depois.</p>` + r.raizes.slice(0,6).map(s => `
    <div class="card root"><span class="pill">${s.g}º ano</span><span class="pill">${esc(AREA_CURTA[s.a])}</span>${r.st[s.c]==="chute"?'<span class="pill warn">resposta rápida demais</span>':""}
      <div style="font-weight:700;margin:8px 0 2px">${esc(s.n)}</div>
      <div class="small mute">Libera ${s.l} habilidade${s.l===1?"":"s"} à frente</div></div>`).join("") + (r.raizes.length > 6 ? `<p class="small mute">+ ${r.raizes.length - 6} outras raízes</p>` : "")
  : `<p class="mute">${r.feito ? "Nenhuma lacuna encontrada até aqui." : "Faça a primeira rodada para aparecer aqui."}</p>`}
  ${r.travadas.length ? `<h2>Vão destravar depois</h2><p class="small mute">Lacunas que dependem das raízes acima. Treine as raízes primeiro.</p><div class="card">${r.travadas.map(s => `<div class="small" style="padding:4px 0">${s.g}º · ${esc(s.n)}</div>`).join("")}</div>` : ""}`;
}
VIEWS.resultado = () => {
  const p = perfis[TELA.id], r = resumo(p);
  return `<button class="link" onclick="ir('${TELA.volta||"inicio"}',{id:'${TELA.id}'})">← Voltar</button>
  <div class="kicker">${esc(p.nome)} · até o ${p.ano}º ano</div><h1>Resultado</h1>${blocoResultado(p, r)}`;
};

// ---------- área dos pais ----------
let paisOk = false;
VIEWS.pais = () => {
  if (paisOk) return VIEWS.painel();
  const criar = !temPin;
  return `<button class="link" onclick="ir('inicio')">← Início</button>
  <div class="kicker">Área dos pais</div><h1>${criar ? "Crie um PIN" : "Digite o PIN"}</h1>
  <p class="mute">${criar ? "4 números para os filhos não entrarem aqui." : ""}</p>
  <input id="pin" class="pin" inputmode="numeric" maxlength="4" autocomplete="off">
  <button class="btn" id="entrar">${criar ? "Salvar PIN" : "Entrar"}</button>`;
};
VIEWS.pais_depois = () => {
  if (paisOk) return VIEWS.painel_depois();
  $("pin").focus();
  $("entrar").onclick = async () => {
    const v = $("pin").value.trim();
    if (!/^\d{4}$/.test(v)) return aviso("O PIN tem 4 números.");
    try { const ok = await rpc("raiz_pin", {p_familia: FAM, p_pin: v});
      if (ok){ temPin = true; paisOk = true; try { await carregar(); } catch(e){} render(); } else aviso("PIN errado.");
    } catch(e){ aviso("Precisa de internet para entrar aqui."); }
  };
};
VIEWS.painel = () => {
  TELA.vivo = true;
  const lista = Object.entries(perfis).sort((a,b) => a[1].criado - b[1].criado);
  return `<div class="row"><button class="link" onclick="paisOk=false;ir('inicio')">← Sair</button><span class="sp"></span><span class="small mute">● atualiza sozinho</span></div>
  <div class="kicker">Área dos pais</div><h1>Painel</h1>
  ${lista.length ? "" : '<p class="mute">Nenhum perfil ainda. Crie um na tela inicial.</p>'}
  ${lista.map(([id,p]) => { const r = resumo(p); const ult = p.respostas[p.respostas.length-1];
    return `<button class="prof" onclick="ir('filho',{id:'${id}',aba:'res'})">
      <span class="av">${esc(p.nome[0]||"?").toUpperCase()}</span>
      <span class="sp"><b>${esc(p.nome)}</b> <span class="small mute">· até o ${p.ano}º</span><br>
      <span class="small mute">${p.respostas.length} respostas · ${Math.round(100*r.feito/r.total)}% · ${r.cont.falha + r.cont.chute} lacunas${r.rap ? " · " + r.rap + " rápidas demais" : ""}</span><br>
      <span class="small mute">${ult ? "Última atividade: " + quando(ult.ts) : "Ainda não começou"}</span></span><span>→</span></button>`; }).join("")}`;
};
VIEWS.painel_depois = () => {};
function quando(ts){
  const d = (Date.now() - ts)/60000;
  if (d < 2) return "agora";
  if (d < 60) return "há " + Math.round(d) + " min";
  if (d < 1440) return "há " + Math.round(d/60) + " h";
  return new Date(ts).toLocaleDateString("pt-BR");
}
function seg(ms){ return (ms/1000).toFixed(ms < 10000 ? 1 : 0).replace(".", ",") + " s"; }
VIEWS.filho = () => {
  if (!paisOk) return VIEWS.pais();
  TELA.vivo = true;
  const p = perfis[TELA.id]; if (!p) return VIEWS.painel();
  const r = resumo(p);
  const tempos = p.respostas.filter(x => x.i !== -1).map(x => x.t).sort((a,b) => a-b);
  const med = tempos.length ? tempos[Math.floor(tempos.length/2)] : 0;
  let corpo = "";
  if (TELA.aba === "res") corpo = blocoResultado(p, r);
  else {
    const lst = p.respostas.map((x, k) => ({...x, k})).reverse().filter(x => TELA.aba === "resp" || (TELA.aba === "erros" && !x.ok) || (TELA.aba === "rap" && x.rap));
    corpo = `<div class="card">${lst.length ? lst.map(x => { const s = BY[x.c];
      const marca = x.i === -1 ? '<span class="pill">não sei</span>' : x.ok ? '<span class="pill ok">acertou</span>' : '<span class="pill bad">errou</span>';
      return `<div class="ans">${marca}${x.rap ? '<span class="pill warn">rápida demais</span>' : ""}<span class="pill">${s.g}º · ${esc(AREA_CURTA[s.a])}</span><span class="small mute">${seg(x.t)}</span>
        <div style="margin:6px 0 4px;font-weight:600">${esc(s.n)}</div>
        <div class="small mute">${s.q.replace(/<table.*?<\/table>/s, "[tabela] ").replace(/<br>/g, " ").replace(/<[^>]+>/g, "")}</div>
        ${x.i === -1 ? "" : `<div class="small" style="margin-top:4px">Respondeu: <b>${esc(s.o[x.i])}</b>${x.ok ? "" : ` · Certa: ${esc(s.o[0])}<br><span class="mute">Erro provável: ${esc(s.e[x.i-1])}</span>`}</div>`}
      </div>`; }).join("") : '<p class="mute">Nada aqui.</p>'}</div>`;
  }
  return `<button class="link" onclick="ir('pais')">← Painel</button>
  <div class="kicker">${esc(p.nome)} · até o ${p.ano}º ano</div><h1>${esc(p.nome)}</h1>
  <p class="small mute">${p.respostas.length} respostas · tempo típico por questão: ${med ? seg(med) : "—"} · ${r.rap} rápidas demais</p>
  <div class="tabs">
    ${[["res","Resultado"],["resp","Respostas"],["erros","Erros"],["rap","Rápidas"]].map(([k,t]) => `<button class="${TELA.aba===k?"on":""}" onclick="ir('filho',{id:'${TELA.id}',aba:'${k}'})">${t}</button>`).join("")}
  </div>${corpo}
  <h2>Opções</h2>
  <button class="btn alt" id="refazer">Refazer o diagnóstico do zero</button>
  <button class="btn alt" id="apagar" style="color:var(--bad);border-color:var(--bad)">Apagar perfil</button>`;
};
VIEWS.filho_depois = () => {
  const confirma = (btn, txt, fn) => { let armado = false; btn.onclick = async () => { if (!armado){ armado = true; btn.textContent = txt; return; } await fn(); }; };
  confirma($("refazer"), "Toque de novo para apagar as respostas", async () => { perfis[TELA.id].respostas = []; await salvarPerfil(TELA.id); ir("filho", {id: TELA.id, aba: "res"}); });
  confirma($("apagar"), "Toque de novo para apagar o perfil", async () => { await apagarPerfil(TELA.id); ir("pais"); });
};

iniciar();
</script>
</body>
</html>
